<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JollyExplorers - Join Our Community</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #1a237e 0%, #283593 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            color: #ffffff;
            position: relative;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        .logo {
            position: absolute;
            top: 30px;
            left: 30px;
            font-size: 24px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 32px;
        }

        .main-content {
            margin-top: 100px;
        }

        .robotics-header {
            font-size: 4rem;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 15px;
            line-height: 1.2;
        }

        .activities-list {
            font-size: 1.1rem;
            color: #e3f2fd;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #ffffff;
            line-height: 1.2;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #e3f2fd;
            margin-bottom: 50px;
            opacity: 0.9;
        }

        .buttons-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 120px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 36px;
            font-size: 1.1rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 250px;
            justify-content: center;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-whatsapp {
            background: #25D366;
            color: #ffffff;
        }

        .btn-whatsapp:hover {
            background: #20ba5a;
        }

        .btn-interests {
            background: #2196F3;
            color: #ffffff;
        }

        .btn-interests:hover {
            background: #1976D2;
        }

        .btn-icon {
            font-size: 1.3rem;
        }

        .footer {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: #90caf9;
            font-size: 0.95rem;
            opacity: 0.9;
            width: 100%;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .robotics-header {
                font-size: 2.5rem;
            }

            .activities-list {
                font-size: 0.9rem;
            }

            h1 {
                font-size: 2rem;
            }

            .subtitle {
                font-size: 1rem;
            }

            .buttons-container {
                flex-direction: column;
                align-items: center;
            }

            .btn {
                width: 100%;
                max-width: 300px;
            }

            .logo {
                position: relative;
                top: 0;
                left: 0;
                justify-content: center;
                margin-bottom: 40px;
            }

            .main-content {
                margin-top: 20px;
            }

            .footer {
                position: relative;
                margin-top: 60px;
                transform: none;
                left: auto;
            }

            .buttons-container {
                margin-bottom: 80px;
            }
        }
    </style>
</head>
<body>
    <a href="#" class="logo">
        <span class="logo-icon">🌟</span>
        <span>JollyExplorers</span>
    </a>

    <div class="container">
        <div class="main-content">
            <div class="robotics-header">Robotics++</div>
            <div class="activities-list">Robotics | Coding | GenAI | VR Learning | Astronomy | Photography | Public Speaking | & more</div>
            <h1>What children do beyond school defines their future</h1>
            <p class="subtitle">Join us for exciting learning experiences</p>
            
            <div class="buttons-container">
                <a href="https://chat.whatsapp.com/IgO58teLJRxI8EyiEyi9qb" 
                   target="_blank" 
                   class="btn btn-whatsapp">
                    <span class="btn-icon">💬</span>
                    <span>Join WhatsApp Community</span>
                </a>
                
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSd4hNGjJNRj3Yz0FCVVInFVHRIdlnZQGtwwfnxOVywEeFl4Lg/viewform?usp=header" 
                   target="_blank" 
                   class="btn btn-interests">
                    <span class="btn-icon">📝</span>
                    <span>Tell us your interests</span>
                </a>
            </div>
        </div>
    </div>

    <div class="footer">
        Maker's Club by JollyExplorers
    </div>
</body>
</html>
